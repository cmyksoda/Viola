name: Tests

on: [push, pull_request, workflow_dispatch]

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.x"]
        include:
          # Newer Ubuntu runners have no Python 3.9 build.
          - os: ubuntu-24.04
            python: "3.9"
          - os: windows-latest
            python: "3.9"
          # Apple's own python3 is 3.9.
          - os: macos-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  window:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python -m pip install -r requirements.txt
      - run: python tests/window_smoke.py
        timeout-minutes: 5
