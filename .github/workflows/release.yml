name: Downloads

# Builds every download: the macOS and Windows apps, the Linux packages and the Android app.
# A pushed v* tag also attaches them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            name: Apple-Silicon
          - runner: macos-15-intel
            name: Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt pyinstaller pillow
      - run: python packaging/freeze.py
      - run: python tests/frozen_smoke.py packaging/build/dist/Viola.app/Contents/MacOS/Viola
      # ditto keeps the app's symlinks and permissions, which a plain zip would break.
      - run: ditto -c -k --keepParent packaging/build/dist/Viola.app Viola-macOS-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Viola-macOS-${{ matrix.name }}
          path: Viola-macOS-${{ matrix.name }}.zip

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt pyinstaller pillow
      - run: python packaging/freeze.py
      - run: python tests/frozen_smoke.py packaging/build/dist/Viola.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Viola-Windows
          path: packaging/build/dist/Viola.exe

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y rpm
      - run: packaging/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Viola-Linux
          path: |
            packaging/build/viola-*.rpm
            packaging/build/viola_*.deb

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends inkscape
      - name: Build and sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VIOLA_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VIOLA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VIOLA_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A release must never go out with the debug key, since Android refuses to update across keys.
          if [ -z "$KEYSTORE_BASE64" ]; then echo "The Android signing secrets are missing." >&2; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          VIOLA_KEYSTORE="$RUNNER_TEMP/release.jks" android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Viola-Android
          path: android/build/viola-*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Viola-macOS-Apple-Silicon.zip
            Viola-macOS-Intel.zip
            Viola.exe
            viola-*.rpm
            viola_*.deb
            viola-*.apk
